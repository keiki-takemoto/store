<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>集計</title>
<meta name="description" content="レジの会計を日別・支払い方法・お客様の種類・担当・商品ごとにまとめて見る画面。">
<meta name="theme-color" content="#2BA55F">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="../shared/theme.css">
<style>
.homebar{background:#2BA55F;color:#fff;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;text-decoration:none;font-weight:700;font-size:15px}
.homebar span{opacity:.85;font-weight:500;font-size:13px;margin-left:auto}
main{max-width:980px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom,0px))}
.sec{padding:14px 15px}

/* 期間 */
.when{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.when button{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;
  padding:8px 14px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1.2}
.when button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.days{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--ink-2)}
.days input{font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);
  border-radius:9px;padding:7px 10px;font-family:inherit}

/* 数字の並び */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px}
.kpi .k{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:23px;font-weight:800;line-height:1.35}
.kpi .s{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.kpi.gro .v{color:var(--ok)}

/* 内訳 */
.bars{display:flex;flex-direction:column;gap:9px}
.bar .t{display:flex;align-items:baseline;gap:9px;font-size:13.5px}
.bar .t .n{font-weight:700}
.bar .t .c{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
.bar .t .p{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);min-width:44px;text-align:right}
.bar .g{height:8px;border-radius:999px;background:var(--surface-3);margin-top:5px;overflow:hidden}
.bar .g i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar.c2 .g i{background:var(--ok)} .bar.c3 .g i{background:var(--am)}
.bar.c4 .g i{background:var(--pm)} .bar.c5 .g i{background:var(--tm)}

/* 一覧 */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;white-space:nowrap}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
/* 会計の一覧。表だと携帯で列がつぶれるので、1件ずつの行にしてある */
.r{display:grid;grid-template-columns:150px 1fr auto;gap:2px 10px;align-items:baseline;
  padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.r .t{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-3)}
.r .sub{font-size:13.5px}
.r .a{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;
  text-align:right;white-space:nowrap}
.r.void{color:var(--ink-3)}
.r.void .t,.r.void .sub,.r.void .a{text-decoration:line-through}
.r.open{border-bottom:none}
@media (max-width:560px){
  .r{grid-template-columns:1fr auto}
  .r .t{grid-row:1;grid-column:1}
  .r .a{grid-row:1;grid-column:2;font-size:16px}
  .r .sub{grid-row:2;grid-column:1/-1;color:var(--ink-2)}
}
.det{font-size:12.5px;color:var(--ink-2);line-height:1.9;padding:2px 6px 14px;
  border-bottom:1px solid var(--line)}
.det .ln{display:flex;gap:10px}
.det .ln .q{font-family:var(--mono);color:var(--ink-3)}
.det .ln .a{margin-left:auto;font-family:var(--mono)}
.det .act{margin-top:8px}
.empty{font-size:13px;color:var(--ink-3);padding:14px 2px;line-height:1.9}
.empty a{color:var(--accent)}
.note{font-size:12px;color:var(--ink-2);line-height:1.8;margin:12px 0 0}
h3{font-size:13px;color:var(--ink-2);margin:0 0 10px}
.card+.card{margin-top:12px}
</style>
</head>
<body>
<a class="homebar" href="../">← ホーム<span>集計</span></a>

<main>
  <div class="card">
    <div class="card-h"><h2>集計</h2><span class="hint" id="range"></span></div>
    <div class="sec">
      <div class="when" id="when">
        <button type="button" data-w="today" aria-pressed="true">今日</button>
        <button type="button" data-w="yest" aria-pressed="false">昨日</button>
        <button type="button" data-w="week" aria-pressed="false">この7日</button>
        <button type="button" data-w="month" aria-pressed="false">今月</button>
        <button type="button" data-w="last" aria-pressed="false">先月</button>
        <button type="button" data-w="pick" aria-pressed="false">えらぶ</button>
      </div>
      <div class="days" id="days" hidden>
        <input type="date" id="from"> 〜 <input type="date" id="to">
        <button class="btn sm" id="go">見る</button>
      </div>
      <div class="row" style="margin-top:11px">
        <button class="btn sm ghost" id="reload">受け取り直す</button>
        <span class="lbl" id="log"></span>
      </div>
    </div>
  </div>

  <div id="body" hidden>
    <div class="card"><div class="sec">
      <div class="kpis" id="kpis"></div>
    </div></div>

    <div class="card"><div class="sec">
      <h3>支払い方法</h3><div class="bars" id="byPay"></div>
    </div></div>

    <div class="card" id="cGuest"><div class="sec">
      <h3>お客様の種類</h3><div class="bars" id="byGuest"></div>
    </div></div>

    <div class="card"><div class="sec">
      <h3>担当</h3><div class="bars" id="byStaff"></div>
    </div></div>

    <div class="card" id="cDay"><div class="sec">
      <h3>日ごと</h3><div class="bars" id="byDay"></div>
    </div></div>

    <div class="card"><div class="sec">
      <h3>よく売れた商品<span class="lbl" style="margin-left:8px">上位20点</span></h3>
      <div id="byItem"></div>
    </div></div>

    <div class="card"><div class="sec">
      <h3>会計の一覧<span class="lbl" style="margin-left:8px">押すと中身が開きます</span></h3>
      <div id="list"></div>
      <p class="note">打ち間違えた会計は、中身を開いて<b>取り消す</b>を押してください。
        売上から外れ、在庫も戻ります（在庫を入れている商品だけ）。<br>
        金額はすべて<b>税込</b>です。<b>粗利</b>は 売上 − 仕入れ値 で出しています（人件費や経費は含みません）。</p>
    </div></div>
  </div>

  <div class="card" id="noneCard" hidden><div class="sec">
    <div class="empty" id="noneMsg"></div>
  </div></div>
</main>

<script src="../shared/sync.js"></script>
<script src="../shared/sales.js"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function yen(n){ return "¥"+Math.round(Number(n)||0).toLocaleString("ja-JP") }
function hhmm(){ var d=new Date(); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2) }
function pad2(n){ return ("0"+n).slice(-2) }
function ymd(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()) }
function plus(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x }

/* ---------- 期間 ---------- */
var W="today", from="", to="";
function setRange(w){
  var now=new Date();
  if(w==="today"){ from=to=ymd(now) }
  else if(w==="yest"){ from=to=ymd(plus(now,-1)) }
  else if(w==="week"){ from=ymd(plus(now,-6)); to=ymd(now) }
  else if(w==="month"){ from=ymd(new Date(now.getFullYear(),now.getMonth(),1)); to=ymd(now) }
  else if(w==="last"){
    var a=new Date(now.getFullYear(),now.getMonth()-1,1);
    from=ymd(a); to=ymd(new Date(now.getFullYear(),now.getMonth(),0));
  }
  if(w!=="pick"){ $("#from").value=from; $("#to").value=to }
}
function labelRange(){
  if(!from) return "";
  return from===to ? from : from+" 〜 "+to;
}
$("#when").addEventListener("click",function(e){
  var b=e.target.closest("[data-w]"); if(!b) return;
  W=b.dataset.w;
  this.querySelectorAll("[data-w]").forEach(function(x){
    x.setAttribute("aria-pressed",String(x.dataset.w===W));
  });
  $("#days").hidden=(W!=="pick");
  if(W==="pick"){ if(!$("#from").value){ setRange("month") } return }
  setRange(W); load(false);
});
$("#go").addEventListener("click",function(){
  var a=$("#from").value, b=$("#to").value;
  if(!a||!b){ toast("日にちを入れてください"); return }
  if(a>b){ var t=a; a=b; b=t }
  from=a; to=b; load(false);
});
$("#reload").addEventListener("click",function(){ load(false) });

/* ---------- 受け取る ---------- */
var rows=[], busy=false;
async function load(quiet){
  if(busy) return;
  busy=true; $("#log").textContent="受け取っています…"; $("#range").textContent=labelRange();
  try{
    var r=await Sales.rows(from,to);
    if(!r.connected){
      rows=[]; $("#body").hidden=true; $("#noneCard").hidden=false;
      $("#noneMsg").innerHTML='まだ置き場所につないでいません。<br>'+
        '<a href="../settings/#conn">設定 → 置き場所</a>でつないでください。';
      $("#log").textContent="";
      busy=false; return;
    }
    rows=r.rows||[];
    $("#log").textContent=hhmm()+" に確認";
    render();
  }catch(e){
    $("#log").textContent="受け取れませんでした："+((e&&e.message)||"");
    if(!quiet) toast("受け取れませんでした");
  }
  busy=false;
}

/* ---------- まとめる ---------- */
function group(list,keyOf,fallback){
  var m={}, order=[];
  list.forEach(function(s){
    var k=keyOf(s)||fallback;
    if(!m[k]){ m[k]={name:k, amt:0, n:0, qty:0}; order.push(k) }
    m[k].amt+=s.total; m[k].n++; m[k].qty+=s.qty;
  });
  return order.map(function(k){ return m[k] }).sort(function(a,b){ return b.amt-a.amt });
}
function bars(el,list,total,fmt){
  if(!list.length){ el.innerHTML='<span class="lbl">ありません</span>'; return }
  el.innerHTML=list.map(function(g,i){
    var p=total?Math.round(g.amt/total*100):0;
    return '<div class="bar c'+((i%5)+1)+'">'+
      '<div class="t"><span class="n">'+esc(g.name)+'</span>'+
        '<span class="p">'+p+'%</span>'+
        '<span class="c">'+yen(g.amt)+'</span></div>'+
      '<div class="g"><i style="width:'+p+'%"></i></div>'+
      '<div class="t" style="margin-top:3px"><span class="p" style="min-width:0;text-align:left">'+
        (fmt?fmt(g):(g.n+"件・"+g.qty+"点"))+'</span></div>'+
      '</div>';
  }).join("");
}
function kpi(k,v,s,cls){
  return '<div class="kpi'+(cls?" "+cls:"")+'"><div class="k">'+esc(k)+'</div>'+
    '<div class="v">'+esc(v)+'</div>'+(s?'<div class="s">'+esc(s)+'</div>':"")+'</div>';
}

function render(){
  $("#range").textContent=labelRange();
  var ok=rows.filter(function(s){ return !s.voided });
  $("#noneCard").hidden=!!ok.length;
  $("#body").hidden=!ok.length;
  if(!ok.length){
    $("#noneMsg").textContent="この期間に会計はありません。";
    /* 取り消した会計だけはある、という場合もあるので一覧は出しておく */
    if(rows.length){ $("#body").hidden=false; $("#noneCard").hidden=true }
    else return;
  }

  var amt=0, cost=0, qty=0, disc=0;
  ok.forEach(function(s){ amt+=s.total; cost+=s.cost; qty+=s.qty; disc+=s.discount });
  var gro=amt-cost;
  $("#kpis").innerHTML=
    kpi("売上",yen(amt),ok.length+"件")+
    kpi("客単価",yen(ok.length?amt/ok.length:0),"1件あたり")+
    kpi("点数",qty+"点",(ok.length?(qty/ok.length).toFixed(1):"0")+"点／件")+
    kpi("粗利",yen(gro),(amt?Math.round(gro/amt*100):0)+"%","gro")+
    kpi("仕入れ値",yen(cost),"売れたぶん")+
    kpi("値引き",yen(disc),"合計");

  bars($("#byPay"),group(ok,function(s){ return s.pay==="card"?"カード":"現金" },"現金"),amt);

  var g=group(ok,function(s){ return s.guest },"（選んでいない）");
  $("#cGuest").hidden=(g.length===1&&g[0].name==="（選んでいない）");
  bars($("#byGuest"),g,amt);

  bars($("#byStaff"),group(ok,function(s){ return s.staff },"（担当なし）"),amt,function(x){
    return x.n+"件・"+x.qty+"点・1件 "+yen(x.amt/x.n);
  });

  var days=group(ok,function(s){ return s.day },"");
  $("#cDay").hidden=(days.length<2);
  bars($("#byDay"),days.slice().sort(function(a,b){ return a.name<b.name?-1:1 }),amt);

  /* 商品ごと */
  var im={}, io=[];
  ok.forEach(function(s){
    (s.lines||[]).forEach(function(l){
      var k=l.id||l.name;
      if(!im[k]){ im[k]={no:l.no||"", name:l.name||"（名前なし）", qty:0, amt:0}; io.push(k) }
      im[k].qty+=Number(l.qty)||0;
      im[k].amt+=(Number(l.price)||0)*(Number(l.qty)||0);
    });
  });
  var items=io.map(function(k){ return im[k] }).sort(function(a,b){ return b.qty-a.qty||b.amt-a.amt });
  $("#byItem").innerHTML=items.length
    ? '<table><thead><tr><th>No</th><th>商品</th><th class="n">数</th><th class="n">金額</th></tr></thead><tbody>'+
      items.slice(0,20).map(function(x){
        return '<tr><td class="n" style="text-align:left;color:var(--ink-3)">'+esc(x.no||"-")+'</td>'+
          '<td>'+esc(x.name)+'</td><td class="n">'+x.qty+'</td><td class="n">'+yen(x.amt)+'</td></tr>';
      }).join("")+'</tbody></table>'
    : '<span class="lbl">ありません</span>';

  renderList();
}

/* ---------- 会計の一覧 ---------- */
var open={};
function renderList(){
  var list=rows.slice(0,200);
  $("#list").innerHTML=
    list.map(function(s){
      var sub=[s.staff||"—", s.guest, (s.pay==="card"?"カード":"現金"), s.qty+"点"]
        .filter(Boolean).join("・");
      var head='<div class="r'+(s.voided?" void":"")+(open[s.id]?" open":"")+'" data-id="'+esc(s.id)+'">'+
        '<span class="t">'+esc(s.at||"")+'</span>'+
        '<span class="sub">'+esc(sub)+'</span>'+
        '<span class="a">'+yen(s.total)+'</span></div>';
      if(!open[s.id]) return head;
      var det='<div class="det">'+
        (s.lines||[]).map(function(l){
          return '<div class="ln"><span class="q">'+esc(l.no||"-")+'</span><span>'+esc(l.name||"")+'</span>'+
            '<span class="a">'+(l.qty>1?l.qty+"点　":"")+yen((l.price||0)*(l.qty||0))+'</span></div>';
        }).join("")+
        (s.discount?'<div class="ln"><span>値引き</span><span class="a">−'+yen(s.discount)+'</span></div>':"")+
        '<div class="ln"><b>合計</b><span class="a"><b>'+yen(s.total)+'</b></span></div>'+
        '<div class="act">'+(s.voided
          ? '<span class="lbl">取り消しずみ</span>'
          : '<button class="btn sm danger" data-void="'+esc(s.id)+'">この会計を取り消す</button>')+
        '</div></div>';
      return head+det;
    }).join("");
}
$("#list").addEventListener("click",async function(e){
  var v=e.target.closest("[data-void]");
  if(v){
    var s=rows.filter(function(x){ return x.id===v.dataset.void })[0]; if(!s) return;
    if(!confirm("この会計（"+yen(s.total)+"）を取り消します。\n売上から外れ、在庫も戻ります。よろしいですか？")) return;
    v.disabled=true; v.textContent="取り消しています…";
    try{ await Sync.saleVoid(s.id); s.voided=true; render(); toast("取り消しました") }
    catch(err){ v.disabled=false; v.textContent="この会計を取り消す"; toast((err&&err.message)||"取り消せませんでした") }
    return;
  }
  var r=e.target.closest(".r"); if(!r) return;
  var id=r.dataset.id;
  if(open[id]) delete open[id]; else open[id]=1;
  renderList();
});

var toastEl=null,tt=null;
function toast(m){
  if(!toastEl){ toastEl=document.createElement("div"); toastEl.className="toast"; document.body.appendChild(toastEl) }
  toastEl.textContent=m; toastEl.hidden=false;
  clearTimeout(tt); tt=setTimeout(function(){ toastEl.hidden=true },3000);
}
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible") load(true);
});

setRange("today");
load(true);
})();
</script>
<script>
(function(){
"use strict";
if("serviceWorker" in navigator){
  var hadSW=!!navigator.serviceWorker.controller, swReloading=false;
  window.addEventListener("load",function(){ navigator.serviceWorker.register("../sw.js").catch(function(){}) });
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(!hadSW||swReloading) return;
    swReloading=true; location.reload();
  });
  var swCheck=function(){
    if(document.visibilityState!=="visible") return;
    try{ navigator.serviceWorker.getRegistration().then(function(r){ if(r) r.update() }).catch(function(){}) }catch(e){}
  };
  document.addEventListener("visibilitychange",swCheck);
  window.addEventListener("pageshow",swCheck);
}
})();
</script>
</body>
</html>
