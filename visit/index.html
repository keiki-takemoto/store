<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>来店</title>
<meta name="description" content="紙で数えていた来客数をそのまま押す画面。欧米・アジア・日本人 × 男・女・子供。">
<meta name="theme-color" content="#2BA55F">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="../shared/theme.css">
<style>
/* 立ったまま押す画面。拡大もページのスクロールもさせない。 */
html,body{height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{display:flex;flex-direction:column}

.bar{background:#2BA55F;color:#fff;display:flex;align-items:center;gap:10px;flex:0 0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 7px) 14px 7px}
.bar a.home{color:#fff;text-decoration:none;font-weight:700;font-size:14px;opacity:.95;white-space:nowrap}
.bar .who{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;
  border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
  line-height:1.4;white-space:nowrap;min-height:34px}
.bar .who .k{opacity:.75;font-weight:500;margin-right:5px}
.bar .sum{margin-left:auto;text-align:right;line-height:1.3;white-space:nowrap}
.bar .sum b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px}
.bar .sum span{font-size:11px;opacity:.85}

.wrap{flex:1 1 auto;min-height:0;padding:10px;display:flex;flex-direction:column;gap:10px}

/* 9つのボタン */
.grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:76px repeat(3,1fr);
  grid-template-rows:34px repeat(3,1fr);gap:8px}
.grid .h{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  color:var(--ink-2)}
.grid .rh{display:flex;align-items:center;justify-content:flex-end;padding-right:4px;
  font-size:14.5px;font-weight:800;color:var(--ink-2);text-align:right;line-height:1.25}
.cell{border:1px solid var(--line-2);background:var(--surface);border-radius:13px;cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;box-shadow:var(--shadow);padding:4px;min-height:60px;position:relative;overflow:hidden}
.cell:active{transform:translateY(1px)}
.cell .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:30px;font-weight:800;
  color:var(--ink);line-height:1.1}
.cell .p{font-size:11.5px;color:var(--ink-3)}
.cell.hit{animation:pop .35s ease}
@keyframes pop{0%{background:var(--accent-2)}100%{background:var(--surface)}}

/* 下の帯 */
.foot{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:10px}
.foot .fig{display:flex;gap:16px;flex-wrap:wrap}
.foot .fig div{font-size:12px;color:var(--ink-2)}
.foot .fig b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;
  font-weight:800;color:var(--ink);line-height:1.35}
.foot .fig .rate b{color:var(--ok)}
.foot .act{margin-left:auto;display:flex;gap:8px;align-items:center}
.log{font-size:11px;color:var(--ink-3)}

/* 担当を選ぶ */
.sheet{position:fixed;inset:0;background:rgba(20,18,12,.45);display:flex;align-items:center;
  justify-content:center;padding:18px;z-index:20}
.sheet-in{background:var(--surface);border-radius:14px;padding:18px;max-width:560px;width:100%;
  box-shadow:var(--shadow)}
.sheet-in h2{font-size:16px;margin-bottom:13px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opts button{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;
  padding:15px 22px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
.opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.sheet-in .note{font-size:12px;color:var(--ink-2);line-height:1.8;margin-top:12px}
.sheet-in .note a{color:var(--accent)}

@media (max-width:560px){
  .grid{grid-template-columns:58px repeat(3,1fr);gap:6px}
  .grid .rh{font-size:13px}
  .cell .n{font-size:24px}
}
</style>
</head>
<body>

<div class="bar">
  <a class="home" href="../">← ホーム</a>
  <button type="button" class="who" id="bStaff"><span class="k">担当</span><span id="bStaffV">—</span></button>
  <div class="sum"><b id="tSum">0人</b><span>今日の来店</span></div>
</div>

<div class="wrap">
  <div class="grid" id="grid"></div>

  <div class="foot">
    <div class="fig">
      <div>来店<b id="fVisit">0人</b></div>
      <div>購入<b id="fBuy">0件</b></div>
      <div class="rate">購買率<b id="fRate">—</b></div>
    </div>
    <div class="act">
      <span class="log" id="log"></span>
      <button class="btn sm" id="undo" disabled>ひとつ戻す</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden><div class="sheet-in" role="dialog" aria-modal="true" aria-label="担当を選ぶ">
  <h2>担当を選んでください</h2>
  <div class="opts" id="staffOpts"></div>
  <p class="note" id="staffNote"></p>
</div></div>

<script src="../shared/sync.js"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pad2(n){ return ("0"+n).slice(-2) }
function today(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()) }
function hhmm(){ var d=new Date(); return pad2(d.getHours())+":"+pad2(d.getMinutes()) }

/* つなぎ先と名簿は 設定 のもの、担当はレジと同じものを借りている */
var K_SHIFT="shiftadmin.v1", K_REG="storereg.v1", K_VIS="storevisit.v1";
function shiftDb(){ try{ return JSON.parse(localStorage.getItem(K_SHIFT))||{} }catch(e){ return {} } }
function cfg(){ var v=shiftDb(); return v.sync||null }
function syncOn(){ var c=cfg(); return !!(window.Sync&&c&&c.url&&c.anon&&c.key) }
if(window.Sync) Sync.configure(cfg());

function loadReg(){
  var v=null; try{ v=JSON.parse(localStorage.getItem(K_REG)) }catch(e){}
  if(!v||typeof v!=="object") v={};
  if(!Array.isArray(v.sales)) v.sales=[];
  return v;
}
function saveReg(){ try{ localStorage.setItem(K_REG,JSON.stringify(REG)) }catch(e){} }
function loadVis(){
  var v=null; try{ v=JSON.parse(localStorage.getItem(K_VIS)) }catch(e){}
  if(!v||typeof v!=="object") v={};
  if(!Array.isArray(v.rows)) v.rows=[];
  return v;
}
function saveVis(){ try{ localStorage.setItem(K_VIS,JSON.stringify(VIS)) }catch(e){} }

var REG=loadReg(), VIS=loadVis();
var AREAS=(window.Sync&&Sync.AREAS)||[], KINDS=(window.Sync&&Sync.KINDS)||[];

/* しばらく使っていなかったら、担当を聞き直す。
   9:10〜13:00 と 13:00〜17:00 のように交代があるので、
   前の人のままだと来店も会計もその人のぶんになってしまう。 */
var ASK_AFTER=45*60*1000;
function staleStaff(){
  var t=Number(REG.lastAt||0);
  return !t || (Date.now()-t)>ASK_AFTER;
}
function touchStaff(){ REG.lastAt=Date.now(); saveReg() }

/* ---------- 担当 ---------- */
function staffList(){
  var db=shiftDb(), hid=db.hidden||[];
  return (db.staff||[]).filter(function(s){ return hid.indexOf(s.name)<0 })
    .map(function(s){ return String(s.disp||s.name||"").trim() })
    .filter(function(n){ return n });
}
function renderStaff(){
  var list=staffList();
  $("#bStaffV").textContent=REG.staff||"選ぶ";
  $("#staffOpts").innerHTML=list.map(function(n){
    return '<button type="button" data-s="'+esc(n)+'" aria-pressed="'+(REG.staff===n)+'">'+esc(n)+'</button>';
  }).join("");
  $("#staffNote").innerHTML=list.length
    ? "レジと同じ担当です。どちらかで変えると、もう片方にも反映されます。"
    : '名簿がありません。<a href="../settings/">設定 → スタッフ</a>で登録してください。';
}
$("#bStaff").addEventListener("click",function(){ renderStaff(); $("#sheet").hidden=false });
$("#staffOpts").addEventListener("click",function(e){
  var b=e.target.closest("[data-s]"); if(!b) return;
  REG.staff=b.dataset.s; touchStaff(); renderStaff(); $("#sheet").hidden=true; renderAll();
});
$("#sheet").addEventListener("click",function(e){ if(e.target===this) this.hidden=true });

/* ---------- 9つのボタン ---------- */
function build(){
  var h='<div class="h"></div>'+KINDS.map(function(k){ return '<div class="h">'+esc(k.nm)+'</div>' }).join("");
  AREAS.forEach(function(a){
    h+='<div class="rh">'+esc(a.nm)+'</div>';
    KINDS.forEach(function(k){
      h+='<button type="button" class="cell" data-a="'+esc(a.k)+'" data-k="'+esc(k.k)+'">'+
         '<span class="n" data-n="'+esc(a.k+"-"+k.k)+'">0</span>'+
         '<span class="p">'+esc(a.nm+" "+k.nm)+'</span></button>';
    });
  });
  $("#grid").innerHTML=h;
}
function visId(){ return "v"+Date.now().toString(36)+Math.random().toString(36).slice(2,7) }
$("#grid").addEventListener("click",function(e){
  var b=e.target.closest(".cell"); if(!b) return;
  if(!REG.staff){ $("#bStaff").click(); return }
  VIS.rows.unshift({ id:visId(), at:new Date().toISOString(), day:today(),
    staff:REG.staff, area:b.dataset.a, kind:b.dataset.k, n:1 });
  saveVis(); touchStaff();
  b.classList.remove("hit"); void b.offsetWidth; b.classList.add("hit");
  renderAll(); flush();
});

/* ---------- ひとつ戻す ---------- */
$("#undo").addEventListener("click",async function(){
  var last=VIS.rows[0]; if(!last) return;
  var b=this; b.disabled=true;
  VIS.rows.shift(); saveVis(); renderAll();
  if(syncOn()&&last.s){
    try{ await Sync.visitDel(last.id) }
    catch(e){ VIS.del=(VIS.del||[]); VIS.del.push(last.id); saveVis() }
  }
  toast("ひとつ戻しました");
  renderAll();
});

/* ---------- 置き場所に送る ---------- */
var flushing=false;
async function flush(){
  if(!syncOn()||flushing) return;
  var wait=VIS.rows.filter(function(x){ return !x.s });
  var del=VIS.del||[];
  if(!wait.length&&!del.length) return;
  flushing=true;
  try{
    if(wait.length){
      await Sync.visitPut(wait.map(function(x){
        return {id:x.id, at:x.at, staff:x.staff, area:x.area, kind:x.kind, n:x.n};
      }));
      wait.forEach(function(x){ x.s=1 });
      saveVis();
    }
    for(var i=0;i<del.length;i++){
      try{ await Sync.visitDel(del[i]) }catch(e){}
    }
    VIS.del=[]; saveVis();
    $("#log").textContent=hhmm()+" に送りました";
  }catch(e){
    $("#log").textContent="送れていません";
  }
  flushing=false;
  renderAll();
}

/* ---------- 画面を描く ---------- */
function todayRows(){ var d=today(); return VIS.rows.filter(function(x){ return x.day===d }) }
function renderAll(){
  var list=todayRows(), by={}, all=0;
  list.forEach(function(x){
    var k=x.area+"-"+x.kind;
    by[k]=(by[k]||0)+(x.n||1); all+=(x.n||1);
  });
  document.querySelectorAll("[data-n]").forEach(function(el){
    el.textContent=by[el.dataset.n]||0;
  });
  var buy=REG.sales.filter(function(s){ return s.day===today() && !s.voided }).length;
  $("#tSum").textContent=all+"人";
  $("#fVisit").textContent=all+"人";
  $("#fBuy").textContent=buy+"件";
  $("#fRate").textContent=all?Math.round(buy/all*100)+"%":"—";
  $("#undo").disabled=!VIS.rows.length;
  var wait=VIS.rows.filter(function(x){ return !x.s }).length;
  if(wait) $("#log").textContent="送っていない "+wait+"件";
}

/* ---------- 受け取る ---------- */
/* ほかの端末で押したぶんも今日の数に入れる */
async function pull(){
  if(!syncOn()) return;
  var d=today();
  var r=await Sync.visitsGet(d,d);
  /* 手元にある「送りずみ」のぶんは置き場所の数と重なるので、入れ替える */
  var mineWait=VIS.rows.filter(function(x){ return !x.s });
  var out=[];
  (r.items||[]).forEach(function(g){
    for(var i=0;i<g.n;i++){
      out.push({ id:"srv-"+g.day+"-"+g.hour+"-"+g.staff+"-"+g.area+"-"+g.kind+"-"+i,
        at:g.day+"T"+pad2(g.hour)+":00:00", day:g.day, staff:g.staff,
        area:g.area, kind:g.kind, n:1, s:1, srv:1 });
    }
  });
  /* 今日ぶんだけ置き場所の内容に合わせ、ほかの日の控えはそのまま残す */
  VIS.rows=mineWait.concat(out).concat(VIS.rows.filter(function(x){ return x.day!==d }));
  saveVis(); renderAll();
}
async function refresh(){
  if(!syncOn()){ $("#log").textContent="つないでいません（数えられます）"; renderAll(); return }
  try{ await flush(); await pull(); $("#log").textContent=hhmm()+" に確認" }
  catch(e){ $("#log").textContent="受け取れませんでした" }
}

var toastEl=null,tt=null;
function toast(m){
  if(!toastEl){ toastEl=document.createElement("div"); toastEl.className="toast"; document.body.appendChild(toastEl) }
  toastEl.textContent=m; toastEl.hidden=false;
  clearTimeout(tt); tt=setTimeout(function(){ toastEl.hidden=true },2200);
}
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState!=="visible") return;
  if(window.Sync) Sync.configure(cfg());
  REG=loadReg(); renderStaff(); refresh();
});
window.addEventListener("online",function(){ flush() });

build(); renderStaff(); renderAll(); refresh();
if(!REG.staff||staleStaff()) $("#sheet").hidden=false;
})();
</script>
<script>
(function(){
"use strict";
if("serviceWorker" in navigator){
  var hadSW=!!navigator.serviceWorker.controller, swReloading=false;
  window.addEventListener("load",function(){ navigator.serviceWorker.register("../sw.js").catch(function(){}) });
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(!hadSW||swReloading) return;
    swReloading=true; location.reload();
  });
  var swCheck=function(){
    if(document.visibilityState!=="visible") return;
    try{ navigator.serviceWorker.getRegistration().then(function(r){ if(r) r.update() }).catch(function(){}) }catch(e){}
  };
  document.addEventListener("visibilitychange",swCheck);
  window.addEventListener("pageshow",swCheck);
}
["gesturestart","gesturechange","gestureend"].forEach(function(ev){
  document.addEventListener(ev,function(e){ e.preventDefault() },{passive:false});
});
document.addEventListener("dblclick",function(e){ e.preventDefault() },{passive:false});
})();
</script>
</body>
</html>
