<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>レジ金</title>
<meta name="description" content="レジの中の現金を、お札と硬貨の枚数で数えて合計を出す画面。記録は1週間だけ残る。">
<meta name="theme-color" content="#2BA55F">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="../shared/theme.css">
<style>
html,body{touch-action:pan-x pan-y}

.homebar{background:#2BA55F;color:#fff;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;text-decoration:none;font-weight:700;font-size:15px}
.homebar span{opacity:.85;font-weight:500;font-size:13px;margin-left:auto}
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 0}
.top-in{max-width:620px;margin:0 auto}
.tabs{display:flex;gap:4px}
.tab{flex:1;border:none;background:transparent;border-bottom:3px solid transparent;padding:9px 4px 10px;
  cursor:pointer;font-size:14px;color:var(--ink-3);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:#2BA55F;font-weight:700}
main{max-width:620px;margin:0 auto;padding:14px 14px calc(120px + env(safe-area-inset-bottom,0px))}
[data-off]{display:none!important}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.8;margin:10px 2px 0}

/* ---- 前の日の現金売上・5万円の目安 ---- */
.prev{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:13px 15px 14px}
.prev .hd{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.prev .amt{font-size:25px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.prev .sub{font-size:12.5px;color:var(--ink-2);line-height:1.75;margin-top:4px}
.prev .tgt{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.prev .tgt b{font-family:var(--mono);font-size:17px;color:var(--ink)}

/* ---- 数える ---- */
.sec{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;margin:14px 2px 6px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.r{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:none}
.r .fc{width:76px;font-weight:700;font-size:16px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.r .mi,.r .pl{width:42px;height:42px;flex:0 0 42px;border:1px solid var(--line-2);background:var(--surface-2);
  border-radius:9px;font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
.r .mi:active,.r .pl:active{transform:translateY(1px)}
.r input{width:62px;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;padding:9px 4px}
.r .mai{font-size:12px;color:var(--ink-3)}
.r .sub{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14.5px;
  color:var(--ink-2);min-width:84px;text-align:right}
.r.has .sub{color:var(--ink);font-weight:700}
.r input[readonly]{cursor:pointer}
/* いま打っている段。どこに数字が入るのか、ひと目で分かるようにする */
.r.sel{background:var(--accent-2)}
.r.sel .fc{color:var(--accent)}
.r.sel input{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-2)}
/* iPhoneの幅（375px）では、そのままだと小計が右にはみ出して読めない。
   「枚」の字を省いて、欄を少しずつ細くして収める。2026-11-25 */
@media (max-width:420px){
  .r{gap:6px;padding:8px 8px}
  .r .fc{width:64px;font-size:15px}
  .r input{width:52px}
  .r .mai{display:none}
  .r .sub{min-width:72px}
}

/* ---- テンキー ---- */
/* iPadの文字盤を出さずに打てるようにする。指で押すので、キーは大きく。
   広い画面では右にならべて出しっぱなし。狭い画面では、段を押したときだけ
   下からせり上がる（合計の帯の上に乗せる）。2026-11-26 */
.cwrap{display:block}
.padhd{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);
  padding:10px 12px 0}
.padhd b{font-family:var(--mono);font-size:16px;color:var(--ink)}
.padhd .v{margin-left:auto;font-family:var(--mono);font-size:16px;font-weight:700;color:var(--ink)}
.padhd .x{border:none;background:transparent;color:var(--accent);font-size:13px;cursor:pointer;padding:4px 2px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:9px 11px 12px}
.pad button{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;
  font-size:25px;font-weight:700;font-family:var(--mono);cursor:pointer;line-height:1;min-height:56px;color:var(--ink)}
.pad button:active{transform:translateY(1px)}
.pad button.fn{font-size:14px;font-family:inherit;color:var(--ink-2);font-weight:600}
.pad button.go{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
  font-family:inherit;font-size:16px;min-height:48px}

/* 狭い画面（iPhone）：下からせり上がる */
.padwrap{position:fixed;left:0;right:0;bottom:var(--footh,96px);z-index:45;
  background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -2px 18px rgba(0,0,0,.14)}
body:not([data-pad="1"]) .padwrap{display:none}
/* せり上がった鍵盤の下に段がかくれるので、そのぶん下を空ける */
body[data-pad="1"] main{padding-bottom:calc(var(--footh,96px) + var(--padh,330px) + 18px)}

/* 広い画面（iPad）：右にならべて出しっぱなし */
@media (min-width:700px){
  main{max-width:900px}
  .cwrap{display:grid;grid-template-columns:1fr 290px;gap:16px;align-items:start}
  .padwrap{position:sticky;top:70px;bottom:auto;left:auto;right:auto;z-index:1;
    border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-top:14px}
  body:not([data-pad="1"]) .padwrap{display:block}
  body[data-pad="1"] main{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
  .padhd .x{display:none}
}

/* ---- 下にはりつく合計 ---- */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--line);box-shadow:0 -2px 14px rgba(0,0,0,.08);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px}
.foot .ttl{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.foot .amt{font-size:27px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.15}
.foot .df{font-size:12.5px;font-family:var(--mono);font-variant-numeric:tabular-nums;margin-top:1px}
.foot .df.ok{color:var(--ok)} .foot .df.ng{color:var(--ng)}
.foot .btn{margin-left:auto;padding:13px 18px;font-size:16px}

/* ---- 記録 ---- */
.log{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  margin-bottom:9px;overflow:hidden}
.log>summary{list-style:none;display:flex;align-items:center;gap:9px;padding:12px 14px;cursor:pointer}
.log>summary::-webkit-details-marker{display:none}
.log .when{font-size:13px;color:var(--ink-2);min-width:0}
.log .when b{display:block;color:var(--ink);font-size:14px}
.log .tot{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;white-space:nowrap}
.log .in{border-top:1px solid var(--line);padding:4px 14px 12px}
.log .ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.log .ln:last-of-type{border-bottom:none}
.log .ln b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.log .del{margin-top:9px}
.empty{color:var(--ink-3);font-size:13.5px;text-align:center;padding:26px 10px}
</style>
</head>
<body>
<a class="homebar" href="../">← ホーム<span>店舗管理</span></a>
<header class="top"><div class="top-in"><div class="tabs" id="tabs">
  <button class="tab" data-v="count" aria-selected="true">🧮 数える</button>
  <button class="tab" data-v="log" aria-selected="false">📋 記録</button>
</div></div></header>

<main>
  <!-- ========== 数える ========== -->
  <div id="v-count">
    <!-- 前の日に現金で受け取った金額。レジ金が合っているか見るときの手がかり。
         レジ金は常に5万円で合わせる決め（竹本さんの指示・2026-11-26）。 -->
    <div class="prev" id="prev">
      <div class="hd">前日の現金売上</div>
      <div class="amt" id="prevAmt">—</div>
      <div class="sub" id="prevSub">読み込んでいます…</div>
      <div class="tgt">レジ金は <b>¥50,000</b> で合わせます</div>
    </div>

    <div class="cwrap">
      <div class="clist">
        <div class="sec">お札</div>
        <div class="rows" id="bills"></div>

        <div class="sec">硬貨</div>
        <div class="rows" id="coins"></div>
      </div>

      <div class="padwrap" id="padwrap">
        <div class="padhd"><b id="padFc">¥10,000</b>の枚数<span class="v" id="padVal">0</span>
          <button type="button" class="x" id="padClose">閉じる</button></div>
        <div class="pad" id="pad">
          <button type="button" data-k="7">7</button>
          <button type="button" data-k="8">8</button>
          <button type="button" data-k="9">9</button>
          <button type="button" data-k="4">4</button>
          <button type="button" data-k="5">5</button>
          <button type="button" data-k="6">6</button>
          <button type="button" data-k="1">1</button>
          <button type="button" data-k="2">2</button>
          <button type="button" data-k="3">3</button>
          <button type="button" class="fn" data-k="c">ぜんぶ消す</button>
          <button type="button" data-k="0">0</button>
          <button type="button" class="fn" data-k="b">← 1字消す</button>
          <button type="button" class="go" data-k="next">次の段へ ↓</button>
        </div>
      </div>
    </div>

    <p class="note">
      <b>段を押してから、テンキーで枚数を打ってください。</b>「次の段へ」で下の段に移ります。<br>
      枚数は空のままで構いません。<br>
      <b>記録は1週間だけ残ります。</b>それより古いものは、この画面を開いたときに自動で消えます。<br>
      記録はこの端末の中だけにあります。ほかの端末とは合わせていません。
    </p>
  </div>

  <!-- ========== 記録 ========== -->
  <div id="v-log" data-off>
    <div id="logs"></div>
    <p class="note" id="logNote"></p>
  </div>
</main>

<div class="foot" id="foot">
  <div class="foot-in">
    <div>
      <div class="ttl">レジ金の合計</div>
      <div class="amt" id="total">¥0</div>
      <div class="df" id="diff"></div>
    </div>
    <button class="btn primary" id="save">保存する</button>
  </div>
</div>

<script src="../shared/sync.js"></script>
<script src="../shared/sales.js"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function yen(n){ n=Math.round(Number(n)||0); return (n<0?"▲¥":"¥")+Math.abs(n).toLocaleString() }
function pad(n){ return ("0"+n).slice(-2) }

/* お札と硬貨。数える順は、手で数えるときと同じ「大きいほうから」。 */
var BILLS=[10000,5000,2000,1000];
var COINS=[500,100,50,10,5,1];

var K="storecash.v1";
/* 置き場所の中身
   { logs:[ {id, at:"2026-11-25T10:41", counts:{"10000":3,…}, total} ] }
   記録はこの端末だけ。ほかの端末とは合わせていない（レジ金は端末ごとに違うため）。 */
var KEEP_DAYS=7;

function load(){
  var v=null;
  try{ v=JSON.parse(localStorage.getItem(K)) }catch(e){}
  if(!v||typeof v!=="object") v={};
  if(!Array.isArray(v.logs)) v.logs=[];
  return v;
}
var DB=load();
function save(){ try{ localStorage.setItem(K,JSON.stringify(DB)) }catch(e){} }

/* 1週間より古い記録を捨てる。開くたびに1回。
   お金の記録をいつまでも端末に残さない、という竹本さんの決め。 */
function sweep(){
  var limit=Date.now()-KEEP_DAYS*24*60*60*1000;
  var before=DB.logs.length;
  DB.logs=DB.logs.filter(function(x){
    var t=Date.parse(x&&x.at);
    return isFinite(t) ? t>=limit : false;     /* 日付が読めないものも捨てる */
  });
  if(DB.logs.length!==before) save();
}
sweep();

/* ---------- 数える ---------- */
var cnt={};                                    /* {"10000":3, …} いま打っている枚数 */

function rowHtml(f){
  var n=Number(cnt[f])||0;
  return '<div class="r'+(n?" has":"")+(sel===f?" sel":"")+'" data-f="'+f+'">'+
    '<span class="fc">'+yen(f)+'</span>'+
    '<button class="mi" data-d="-1" aria-label="'+yen(f)+' を1枚へらす">−</button>'+
    '<input type="text" inputmode="none" readonly value="'+(n?n:"")+'" placeholder="0" aria-label="'+yen(f)+' の枚数">'+
    '<button class="pl" data-d="1" aria-label="'+yen(f)+' を1枚ふやす">＋</button>'+
    '<span class="mai">枚</span>'+
    '<span class="sub">'+(n?yen(f*n):"—")+'</span>'+
  '</div>';
}
function renderRows(){
  $("#bills").innerHTML=BILLS.map(rowHtml).join("");
  $("#coins").innerHTML=COINS.map(rowHtml).join("");
}
function total(){
  var t=0;
  BILLS.concat(COINS).forEach(function(f){ t+=f*(Number(cnt[f])||0) });
  return t;
}
/* レジ金は常に5万円で合わせる、とお店で決めている（2026-11-26）。
   数えた合計がここからどれだけ離れているかを、合計のすぐ下に出す。 */
var TARGET=50000;
function renderTotal(){
  var t=total();
  $("#total").textContent=yen(t);
  var el=$("#diff"), d=t-TARGET;
  el.className="df"+(t?(d===0?" ok":" ng"):"");
  /* まだ1枚も入れていないうちから「▲¥50,000」と出ると驚くので、数え始めてから出す */
  el.textContent = !t ? ""
    : (d===0 ? "5万円ぴったり"
             : "5万円より "+(d>0?"+":"−")+"¥"+Math.abs(d).toLocaleString());
}
/* 1か所さわったら、その行と合計だけ直す（全部描き直すと、打っている途中の欄が飛ぶ） */
function touchRow(f){
  var r=document.querySelector('.r[data-f="'+f+'"]'); if(!r) return;
  var n=Number(cnt[f])||0;
  r.classList.toggle("has",!!n);
  r.querySelector(".sub").textContent = n?yen(f*n):"—";
  renderTotal();
}
function setCount(f,n){
  n=Math.max(0,Math.min(9999,Math.floor(Number(n)||0)));   /* 1万枚は数えない */
  if(n) cnt[f]=n; else delete cnt[f];
  touchRow(f);
}

/* ---------- テンキー ---------- */
/* sel … いま打っている段（1万円・5千円…）。null のときは、どこにも入らない。 */
var ALL=BILLS.concat(COINS);
function wide(){ return window.matchMedia("(min-width:700px)").matches }
/* 広い画面は右に出しっぱなしなので最初から1万円の段。
   狭い画面は鍵盤が段の上に乗るので、押されるまで出さない。 */
var sel=wide()?ALL[0]:null;
function syncInput(f){
  var el=document.querySelector('.r[data-f="'+f+'"] input');
  if(el) el.value=(Number(cnt[f])||0)||"";
}
function renderPad(){
  document.body.dataset.pad=(sel==null)?"":"1";
  if(sel==null) return;
  $("#padFc").textContent=yen(sel);
  $("#padVal").textContent=(Number(cnt[sel])||0)+"枚";
  var h=$("#padwrap").offsetHeight;
  if(h) document.documentElement.style.setProperty("--padh",h+"px");
}
function pick(f){
  var old=sel; sel=f;
  [old,f].forEach(function(k){
    var r=document.querySelector('.r[data-f="'+k+'"]');
    if(r) r.classList.toggle("sel",k===sel);
  });
  renderPad();
  var r2=document.querySelector('.r[data-f="'+f+'"]');
  if(r2&&!wide()) r2.scrollIntoView({block:"center"});
}
$("#padClose").addEventListener("click",function(){ sel=null; renderPad(); renderRows() });
$("#pad").addEventListener("click",function(e){
  var b=e.target.closest("button[data-k]"); if(!b||sel==null) return;
  var k=b.dataset.k, cur=String(Number(cnt[sel])||"");
  if(k==="c"){ setCount(sel,0) }
  else if(k==="b"){ setCount(sel,cur.slice(0,-1)) }
  else if(k==="next"){
    var i=ALL.indexOf(sel);
    pick(ALL[(i+1)%ALL.length]);                 /* いちばん下まで行ったら上に戻る */
    return;
  }
  else{
    if(cur.length>=4) return;                    /* 9999枚まで */
    setCount(sel,cur+k);
  }
  syncInput(sel); renderPad();
});

document.addEventListener("click",function(e){
  /* 段のどこかを押したら、その段を打つことにする（＋と−は下でさばく） */
  var r=e.target.closest(".r");
  if(r&&!e.target.closest(".mi,.pl")) pick(Number(r.dataset.f));
  var b=e.target.closest(".r .mi,.r .pl"); if(!b) return;
  var r=b.closest(".r"), f=Number(r.dataset.f);
  var n=(Number(cnt[f])||0)+Number(b.dataset.d);
  setCount(f,n);
  var el=r.querySelector("input");
  el.value=(Number(cnt[f])||0)||"";
  if(sel===f) renderPad();
});
$("#save").addEventListener("click",function(){
  var t=total();
  if(!t){ toast("枚数がまだ入っていません"); return }
  var d=new Date();
  DB.logs.unshift({
    id:String(d.getTime()),
    at:d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes()),
    counts:JSON.parse(JSON.stringify(cnt)), total:t
  });
  sweep(); save(); renderLogs();
  cnt={}; sel=wide()?ALL[0]:null; renderRows(); renderTotal(); renderPad();   /* 次の人がそのまま数えられるよう、空に戻す */
  toast(yen(t)+" を記録しました");
});

/* ---------- 前日の現金売上 ---------- */
/* レジの会計のうち、支払い方法が現金のものだけを足す。
   打ち消した会計は数えない。古い会計には pay が無いので、無いものは現金とみなす
   （レジがカードとPayPayを選べるようになる前は、全部現金だったため）。 */
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()) }
function dayLabel(key){
  var p=String(key).split("-");
  var w=["日","月","火","水","木","金","土"][new Date(key+"T00:00").getDay()];
  return (+p[1])+"月"+(+p[2])+"日（"+w+"）";
}
async function loadPrev(){
  if(!(window.Sales)) return;
  var now=new Date();
  var to=new Date(now);   to.setDate(to.getDate()-1);     /* 前の日まで */
  var from=new Date(now); from.setDate(from.getDate()-7); /* 直近1週間を見る */
  var yKey=ymd(to);
  var r;
  try{ r=await Sales.rows(ymd(from),yKey) }
  catch(e){
    $("#prevAmt").textContent="—";
    $("#prevSub").textContent="売上を受け取れませんでした。置き場所につながっていないかもしれません。";
    return;
  }
  var byDay={};
  (r.rows||[]).forEach(function(s){
    if(s.voided) return;
    if((s.pay||"cash")!=="cash") return;
    byDay[s.day]=(byDay[s.day]||0)+(Number(s.total)||0);
  });
  var y=byDay[yKey]||0;
  $("#prevAmt").textContent=yen(y);

  var sub=dayLabel(yKey)+"　現金のお会計だけの合計です。";
  if(!y){
    /* 前の日がお休みだったときのために、直近でお会計があった日も出す */
    var days=Object.keys(byDay).filter(function(k){ return byDay[k]>0 }).sort();
    var last=days[days.length-1];
    sub = last
      ? dayLabel(yKey)+"　現金のお会計はありませんでした。<br>直近は <b>"+dayLabel(last)+" "+yen(byDay[last])+"</b>。"
      : dayLabel(yKey)+"　直近1週間に、現金のお会計がありません。";
  }
  if(!r.connected){
    sub+="<br><b>この端末で打ったぶんだけ</b>です（置き場所につないでいません）。";
  }
  $("#prevSub").innerHTML=sub;
}

/* ---------- 記録 ---------- */
function renderLogs(){
  if(!DB.logs.length){
    $("#logs").innerHTML='<div class="empty">まだ記録がありません。<br>「数える」で枚数を入れて保存してください。</div>';
    $("#logNote").textContent="";
    return;
  }
  $("#logs").innerHTML=DB.logs.map(function(x){
    var p=x.at.split("T"), ymd=p[0].split("-");
    var w=["日","月","火","水","木","金","土"][new Date(p[0]+"T00:00").getDay()];
    var lines=BILLS.concat(COINS).filter(function(f){ return Number(x.counts&&x.counts[f])>0 })
      .map(function(f){
        var n=Number(x.counts[f]);
        return '<div class="ln"><span>'+yen(f)+' × '+n+'枚</span><b>'+yen(f*n)+'</b></div>';
      }).join("");
    /* あとから見たときにも、5万円と合っていたかが分かるように出す */
    var d=(Number(x.total)||0)-TARGET;
    lines+='<div class="ln"><span>5万円との差</span><b style="color:var('+(d?"--ng":"--ok")+')">'+
      (d===0?"ぴったり":(d>0?"+":"−")+"¥"+Math.abs(d).toLocaleString())+'</b></div>';
    return '<details class="log">'+
      '<summary>'+
        '<span class="when"><b>'+(+ymd[1])+'月'+(+ymd[2])+'日（'+w+'）</b>'+p[1]+'</span>'+
        '<span class="tot">'+yen(x.total)+'</span>'+
      '</summary>'+
      '<div class="in">'+lines+
        '<button class="btn sm danger del" data-id="'+esc(x.id)+'">この記録を消す</button>'+
      '</div></details>';
  }).join("");
  $("#logNote").textContent="1週間より古い記録は自動で消えます。いま "+DB.logs.length+"件。";
}
$("#logs").addEventListener("click",function(e){
  var b=e.target.closest(".del"); if(!b) return;
  if(!confirm("この記録を消します。よろしいですか。")) return;
  DB.logs=DB.logs.filter(function(x){ return String(x.id)!==b.dataset.id });
  save(); renderLogs(); toast("消しました");
});

/* ---------- 共通 ---------- */
$("#tabs").addEventListener("click",function(e){
  var b=e.target.closest(".tab[data-v]"); if(!b) return;
  ["count","log"].forEach(function(v){ $("#v-"+v).toggleAttribute("data-off",v!==b.dataset.v) });
  this.querySelectorAll(".tab").forEach(function(t){ t.setAttribute("aria-selected",String(t===b)) });
  $("#foot").hidden = b.dataset.v!=="count";   /* 記録を見ているときは、合計の帯も鍵盤も出さない */
  document.body.dataset.pad=(b.dataset.v==="count"&&sel!=null)?"1":"";
  window.scrollTo({top:0});
});
var toastEl=null,tt=null;
function toast(m){
  if(!toastEl){ toastEl=document.createElement("div"); toastEl.className="toast"; document.body.appendChild(toastEl) }
  toastEl.textContent=m; toastEl.hidden=false;
  clearTimeout(tt); tt=setTimeout(function(){ toastEl.hidden=true },3000);
}
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"){ sweep(); renderLogs(); loadPrev() }
});

renderRows(); renderTotal(); renderLogs(); renderPad();
loadPrev();

/* 狭い画面では、テンキーを合計の帯の上に乗せる。帯の高さは中身で変わるので測る。 */
function syncFootH(){
  document.documentElement.style.setProperty("--footh",$("#foot").offsetHeight+"px");
}
syncFootH();
window.addEventListener("resize",function(){
  syncFootH();
  if(wide()&&sel==null) sel=ALL[0];       /* 横向きにしたら、鍵盤を出しっぱなしに戻す */
  renderPad(); renderRows();
});

/* ピンチやダブルタップでの拡大を止める */
["gesturestart","gesturechange","gestureend"].forEach(function(ev){
  document.addEventListener(ev,function(e){ e.preventDefault() },{passive:false});
});
document.addEventListener("dblclick",function(e){ e.preventDefault() },{passive:false});
})();
</script>
<script>
if("serviceWorker" in navigator){
  var hadSW=!!navigator.serviceWorker.controller, swReloading=false;
  window.addEventListener("load",function(){ navigator.serviceWorker.register("../sw.js").catch(function(){}) });
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(!hadSW||swReloading) return;
    swReloading=true; location.reload();
  });
}
</script>
